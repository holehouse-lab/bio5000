<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title</title>
  <meta name="description" content="$description">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-text">
    <p class="eyebrow">$course <span aria-hidden="true">·</span> $semester</p>
    <h1>$title</h1>
    <p class="tagline">$tagline</p>
  </div>

  <!-- Header figure: the image saved as static/hero.png. Update the alt text if the image changes. -->
  <img class="hero-figure" src="$hero_figure_name"
       alt="Illustration of a transcription factor with disordered regions, bound to chromatin inside a nucleus.">

  <dl class="details">
$details_html
  </dl>

  <nav aria-label="Sections">
$navigation_html
  </nav>
</header>

<main data-schedule-year="$schedule_year">
$content_html
</main>

<footer>
  <p>$course <span aria-hidden="true">·</span> Washington University in St. Louis</p>
  <p>Last updated $build_date</p>
</footer>

<script>
  // Schedule niceties: grey out unfilled (TBD) slots and past sessions, and flag the next session.
  // Dates in the first column are written like "Jan 19"; the year comes from the page's front matter.
  (function () {
    var scheduleYear = document.querySelector("main").dataset.scheduleYear;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var nextSessionFound = false;

    document.querySelectorAll("main table tbody tr").forEach(function (row) {
      row.querySelectorAll("td").forEach(function (cell) {
        if (cell.textContent.trim() === "TBD") {
          cell.classList.add("is-tbd");
        }
      });

      var sessionDate = new Date(row.cells[0].textContent.trim() + ", " + scheduleYear);
      if (isNaN(sessionDate)) {
        return;
      }
      if (sessionDate < today) {
        row.classList.add("is-past");
      } else if (!nextSessionFound) {
        row.classList.add("is-next");
        nextSessionFound = true;
      }
    });
  })();
</script>

</body>
</html>
